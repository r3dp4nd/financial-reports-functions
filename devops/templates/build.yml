jobs:
  - job: Build
    displayName: Build release artifact

    pool:
      vmImage: 'ubuntu-latest'

    steps:
      - checkout: self
        clean: true
        fetchDepth: 1

      - task: UseNode@1
        displayName: Use Node.js 24

        inputs:
          version: '24.x'
          checkLatest: false
          force32bit: false

      - script: npm ci
        displayName: Install dependencies

      - script: npm run build:prod
        displayName: Build production application

      - task: CopyFiles@2
        displayName: Prepare deployment package

        inputs:
          SourceFolder: '$(Build.SourcesDirectory)'

          Contents: |
            dist/**
            host.json
            package.json
            package-lock.json

          TargetFolder: '$(Build.ArtifactStagingDirectory)/package'

          CleanTargetFolder: true

      - script: npm ci --omit=dev
        displayName: Install production dependencies

        workingDirectory: '$(Build.ArtifactStagingDirectory)/package'

      - task: ArchiveFiles@2
        displayName: Create deployment ZIP

        inputs:
          rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/package'
          includeRootFolder: false
          archiveType: 'zip'
          archiveFile: '$(Build.ArtifactStagingDirectory)/function-app.zip'
          replaceExistingArchive: true

      - task: PublishPipelineArtifact@1
        displayName: Publish release artifact

        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/function-app.zip'
          artifact: 'function-app'
