parameters:
  # ============================================================
  # Environment
  # ============================================================

  - name: environmentName
    type: string

  # ============================================================
  # Azure
  # ============================================================

  - name: azureServiceConnection
    type: string

  - name: functionAppName
    type: string

  - name: isFlexConsumption
    type: boolean
    default: false

  # ============================================================
  # Agent
  # ============================================================

  - name: vmImage
    type: string
    default: 'ubuntu-latest'

  # ============================================================
  # Artifact
  # ============================================================

  - name: artifactName
    type: string
    default: 'function-app'

  - name: packageFileName
    type: string
    default: 'function-app.zip'

  # ============================================================
  # Deployment
  # ============================================================

  - name: deploymentMethod
    type: string
    default: 'auto'

  # ============================================================
  # Post-deployment validation
  # ============================================================

  - name: runSmokeTest
    type: boolean
    default: false

  - name: smokeTestCommand
    type: string
    default: ''


jobs:

  - deployment: DeployFunctionApp
    displayName: Deploy Azure Function App

    pool:
      vmImage: ${{ parameters.vmImage }}

    environment:
      name: ${{ parameters.environmentName }}

    strategy:

      runOnce:

        deploy:

          steps:

            # ==================================================
            # Disable automatic artifact download
            # ==================================================

            - download: none


            # ==================================================
            # Download only the immutable deployment artifact
            # ==================================================

            - task: DownloadPipelineArtifact@2
              displayName: Download deployment artifact

              inputs:
                buildType: 'current'

                artifactName:
                  ${{ parameters.artifactName }}

                targetPath:
                  '$(Pipeline.Workspace)/${{ parameters.artifactName }}'


            # ==================================================
            # Verify artifact integrity
            # ==================================================

            - script: >
                node
                "$(Pipeline.Workspace)/${{ parameters.artifactName }}/tools/verify-checksum.js"
                "$(Pipeline.Workspace)/${{ parameters.artifactName }}/${{ parameters.packageFileName }}"
                "$(Pipeline.Workspace)/${{ parameters.artifactName }}/${{ parameters.packageFileName }}.sha256"
              displayName: Verify artifact integrity


            # ==================================================
            # Deploy - Flex Consumption
            # ==================================================

            - ${{ if eq(parameters.isFlexConsumption, true) }}:

                - task: AzureFunctionApp@2
                  displayName: Deploy Azure Function App

                  inputs:
                    azureSubscription:
                      ${{ parameters.azureServiceConnection }}

                    appType:
                      'functionAppLinux'

                    isFlexConsumption:
                      true

                    appName:
                      ${{ parameters.functionAppName }}

                    package:
                      '$(Pipeline.Workspace)/${{ parameters.artifactName }}/${{ parameters.packageFileName }}'


            # ==================================================
            # Deploy - Non Flex
            # ==================================================

            - ${{ if eq(parameters.isFlexConsumption, false) }}:

                - task: AzureFunctionApp@2
                  displayName: Deploy Azure Function App

                  inputs:
                    azureSubscription:
                      ${{ parameters.azureServiceConnection }}

                    appType:
                      'functionAppLinux'

                    appName:
                      ${{ parameters.functionAppName }}

                    package:
                      '$(Pipeline.Workspace)/${{ parameters.artifactName }}/${{ parameters.packageFileName }}'

                    deploymentMethod:
                      ${{ parameters.deploymentMethod }}


            # ==================================================
            # Optional environment-specific smoke test
            # ==================================================

            - ${{ if eq(parameters.runSmokeTest, true) }}:

                - script:
                    ${{ parameters.smokeTestCommand }}

                  displayName:
                    Run post-deployment smoke test
