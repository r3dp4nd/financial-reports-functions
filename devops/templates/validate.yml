jobs:
  - job: Validate
    displayName: Validate Pull Request

    pool:
      vmImage: 'ubuntu-latest'

    steps:
      - checkout: self
        clean: true
        fetchDepth: 0

      - task: UseNode@1
        displayName: Use Node.js 24

        inputs:
          version: '24.x'
          checkLatest: false
          force32bit: false

      - script: npm ci
        displayName: Install dependencies

      - script: npm run typecheck
        displayName: Validate TypeScript compilation

      - task: SonarCloudPrepare@3
        displayName: Prepare SonarQube Cloud analysis

        inputs:
          SonarCloud: '<SONARQUBE-CLOUD-SERVICE-CONNECTION>'
          organization: '<SONARQUBE-CLOUD-ORGANIZATION>'
          scannerMode: 'cli'
          configMode: 'file'

      - script: npm run test:coverage
        displayName: Run tests with coverage

      - task: SonarCloudAnalyze@3
        displayName: Run SonarQube Cloud analysis

      - task: SonarCloudPublish@3
        displayName: Publish SonarQube Cloud Quality Gate

        inputs:
          pollingTimeoutSec: '300'
