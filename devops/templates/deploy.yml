parameters:
  - name: environmentName
    type: string

  - name: azureServiceConnection
    type: string

  - name: functionAppName
    type: string

  - name: artifactSource
    type: string
    default: 'current'

  - name: artifactName
    type: string
    default: 'function-app'

  - name: isFlexConsumption
    type: boolean
    default: false

  - name: republishArtifact
    type: boolean
    default: false


jobs:

  - deployment: DeployFunctionApp
    displayName: Deploy Azure Function App

    pool:
      vmImage: 'ubuntu-latest'

    environment:
      name: ${{ parameters.environmentName }}

    strategy:
      runOnce:
        deploy:
          steps:

            - download: none


            # DEV: artifact generated in the same pipeline.
            - ${{ if eq(parameters.artifactSource, 'current') }}:

                - download: current
                  artifact: ${{ parameters.artifactName }}


            # UAT / STG / PRD:
            # artifact generated by previous environment pipeline.
            - ${{ if ne(parameters.artifactSource, 'current') }}:

                - download: ${{ parameters.artifactSource }}
                  artifact: ${{ parameters.artifactName }}


            # Flex Consumption
            - ${{ if eq(parameters.isFlexConsumption, true) }}:

                - task: AzureFunctionApp@2
                  displayName: Deploy Azure Function App

                  inputs:
                    azureSubscription:
                      ${{ parameters.azureServiceConnection }}

                    appType:
                      'functionAppLinux'

                    isFlexConsumption:
                      true

                    appName:
                      ${{ parameters.functionAppName }}

                    package:
                      '$(Pipeline.Workspace)/${{ parameters.artifactSource }}/${{ parameters.artifactName }}/function-app.zip'


            # Non-Flex
            - ${{ if eq(parameters.isFlexConsumption, false) }}:

                - task: AzureFunctionApp@2
                  displayName: Deploy Azure Function App

                  inputs:
                    azureSubscription:
                      ${{ parameters.azureServiceConnection }}

                    appType:
                      'functionAppLinux'

                    appName:
                      ${{ parameters.functionAppName }}

                    package:
                      '$(Pipeline.Workspace)/${{ parameters.artifactSource }}/${{ parameters.artifactName }}/function-app.zip'

                    deploymentMethod:
                      'auto'


            # Promote exactly the artifact that was deployed.
            - ${{ if eq(parameters.republishArtifact, true) }}:

                - task: PublishPipelineArtifact@1
                  displayName: Promote deployment artifact

                  inputs:
                    targetPath:
                      '$(Pipeline.Workspace)/${{ parameters.artifactSource }}/${{ parameters.artifactName }}/function-app.zip'

                    artifact:
                      ${{ parameters.artifactName }}
