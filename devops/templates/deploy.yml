parameters:
  - name: environmentName
    type: string

  - name: azureServiceConnection
    type: string

  - name: functionAppName
    type: string

  - name: artifactSource
    type: string
    default: 'current'

  - name: artifactName
    type: string
    default: 'function-app'

  - name: isFlexConsumption
    type: boolean
    default: false


jobs:

  - deployment: DeployFunctionApp
    displayName: Deploy Azure Function App

    pool:
      vmImage: 'ubuntu-latest'

    environment:
      name: ${{ parameters.environmentName }}

    strategy:

      runOnce:

        deploy:

          steps:

            - download: none


            - ${{ if eq(parameters.artifactSource, 'current') }}:

                - download: current
                  artifact: ${{ parameters.artifactName }}


            - ${{ if ne(parameters.artifactSource, 'current') }}:

                - download: ${{ parameters.artifactSource }}

                  artifact: ${{ parameters.artifactName }}


            # DEV artifact path
            - ${{ if and(eq(parameters.artifactSource, 'current'),eq(parameters.isFlexConsumption, false)) }}:

                - task: AzureFunctionApp@2
                  displayName: Deploy Azure Function App

                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}

                    appType: 'functionAppLinux'

                    appName: ${{ parameters.functionAppName }}

                    package: '$(Pipeline.Workspace)/${{ parameters.artifactName }}/function-app.zip'

                    deploymentMethod: 'auto'


            # Promoted artifact path
            - ${{if and(ne(parameters.artifactSource, 'current'),eq(parameters.isFlexConsumption, false))}}:

                - task: AzureFunctionApp@2
                  displayName: Deploy Azure Function App

                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}

                    appType: 'functionAppLinux'

                    appName: ${{ parameters.functionAppName }}

                    package: '$(Pipeline.Workspace)/${{ parameters.artifactSource }}/${{ parameters.artifactName }}/function-app.zip'

                    deploymentMethod: 'auto'


            # DEV Flex
            - ${{ if and(eq(parameters.artifactSource, 'current'),eq(parameters.isFlexConsumption, true)) }}:

                - task: AzureFunctionApp@2
                  displayName: Deploy Azure Function App

                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}

                    appType: 'functionAppLinux'

                    isFlexConsumption: true

                    appName: ${{ parameters.functionAppName }}

                    package: '$(Pipeline.Workspace)/${{ parameters.artifactName }}/function-app.zip'


            # Promoted Flex
            - ${{ if and(ne(parameters.artifactSource, 'current'),eq(parameters.isFlexConsumption, true)) }}:

                - task: AzureFunctionApp@2
                  displayName: Deploy Azure Function App

                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}

                    appType: 'functionAppLinux'

                    isFlexConsumption: true

                    appName: ${{ parameters.functionAppName }}

                    package: '$(Pipeline.Workspace)/${{ parameters.artifactSource }}/${{ parameters.artifactName }}/function-app.zip'
