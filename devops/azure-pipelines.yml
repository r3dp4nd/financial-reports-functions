trigger: none

pr: none


name: azure-function-$(Date:yyyyMMdd).$(Rev:r)


parameters:
  - name: runTests
    displayName: Run tests
    type: boolean
    default: true

  - name: runCoverage
    displayName: Run coverage
    type: boolean
    default: false

  - name: runSonar
    displayName: Run SonarQube
    type: boolean
    default: false


stages:

  # ============================================================
  # BUILD ONCE
  # ============================================================

  - stage: Build
    displayName: Build

    jobs:

      - template: templates/build.yml

        parameters:
          runTests:
            ${{ parameters.runTests }}

          runCoverage:
            ${{ parameters.runCoverage }}

          runSonar:
            ${{ parameters.runSonar }}

          buildCommand:
            'npm run build:prod'

          testCommand:
            'npm test'

          coverageCommand:
            'npm run test:coverage'

          sonarServiceConnection:
            '<SONARQUBE-SERVICE-CONNECTION>'

          sonarProjectKey:
            '<SONAR-PROJECT-KEY>'

          sonarProjectName:
            '<SONAR-PROJECT-NAME>'


  # ============================================================
  # DEV
  # ============================================================

  - stage: DEV
    displayName: DEV

    dependsOn:
      - Build

    condition: succeeded()

    jobs:

      - template: templates/deploy.yml

        parameters:
          environmentName:
            '<ENVIRONMENT-DEV>'

          azureServiceConnection:
            '<SERVICE-CONNECTION-DEV>'

          functionAppName:
            '<FUNCTION-APP-DEV>'


  # ============================================================
  # UAT
  # ============================================================

  - stage: UAT
    displayName: UAT

    dependsOn:
      - DEV

    condition: succeeded()

    jobs:

      - template: templates/deploy.yml

        parameters:
          environmentName:
            '<ENVIRONMENT-UAT>'

          azureServiceConnection:
            '<SERVICE-CONNECTION-UAT>'

          functionAppName:
            '<FUNCTION-APP-UAT>'


  # ============================================================
  # STG
  # ============================================================

  - stage: STG
    displayName: STG

    dependsOn:
      - UAT

    condition: succeeded()

    jobs:

      - template: templates/deploy.yml

        parameters:
          environmentName:
            '<ENVIRONMENT-STG>'

          azureServiceConnection:
            '<SERVICE-CONNECTION-STG>'

          functionAppName:
            '<FUNCTION-APP-STG>'


  # ============================================================
  # PRD
  # ============================================================

  - stage: PRD
    displayName: PRD

    dependsOn:
      - STG

    condition: succeeded()

    jobs:

      - template: templates/deploy.yml

        parameters:
          environmentName:
            '<ENVIRONMENT-PRD>'

          azureServiceConnection:
            '<SERVICE-CONNECTION-PRD>'

          functionAppName:
            '<FUNCTION-APP-PRD>'
