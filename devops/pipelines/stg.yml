trigger: none

pr: none

name: function-stg-$(Date:yyyyMMdd).$(Rev:r)

resources:
  pipelines:
    - pipeline: uat
      source: '<UAT-PIPELINE-NAME>'

      trigger: true

stages:

  - stage: Deploy_STG
    displayName: Deploy STG

    jobs:
      - template: ../templates/deploy.yml

        parameters:
          environmentName: '<ENVIRONMENT-STG>'
          azureServiceConnection: '<SERVICE-CONNECTION-STG>'
          functionAppName: '<FUNCTION-APP-STG>'

          artifactSource: uat

          republishArtifact: true
