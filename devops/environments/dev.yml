parameters:
  - name: artifactName
    type: string
    default: 'function-app'

  - name: packageFileName
    type: string
    default: 'function-app.zip'

  - name: runSmokeTest
    type: boolean
    default: false

  - name: smokeTestCommand
    type: string
    default: ''


stages:

  - stage: Deploy_DEV
    displayName: Deploy DEV

    dependsOn:
      - Build

    condition: succeeded()

    jobs:

      - template: ../templates/deploy/azure-function-deploy.yml

        parameters:
          environmentName: '<AZURE-DEVOPS-ENVIRONMENT-DEV>'

          azureServiceConnection: '<AZURE-SERVICE-CONNECTION-DEV>'

          functionAppName: '<FUNCTION-APP-NAME-DEV>'

          artifactName: ${{ parameters.artifactName }}

          packageFileName: ${{ parameters.packageFileName }}

          appType: 'functionAppLinux'

          isFlexConsumption: false

          runSmokeTest: ${{ parameters.runSmokeTest }}

          smokeTestCommand: ${{ parameters.smokeTestCommand }}
